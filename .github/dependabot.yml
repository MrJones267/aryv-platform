# Weekly version updates. Security updates are separate: they are enabled in
# the repository settings and open as soon as an advisory is published.
#
# Minor and patch bumps are grouped into one PR per ecosystem a week; major
# bumps each get their own PR, because they can need code changes.
version: 2
updates:
  # Root npm workspace: backend, admin-panel, shared (one package-lock.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      server-minor-patch:
        update-types: [minor, patch]

  # React Native app: its own package-lock.json, outside the workspace.
  - package-ecosystem: npm
    directory: /mobile-app
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Gaborone
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps-app)
    # React Native and the packages tied to its version are upgraded as a
    # project, not by a weekly bump: 0.72 -> 0.88 arrived as a "minor" group
    # update (#78), because a 0.x minor counts as minor. Native modules that
    # track React Native's version are held at their major for the same reason.
    ignore:
      - dependency-name: "react-native"
      - dependency-name: "react"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/cli*"
      - dependency-name: "metro*"
      - dependency-name: "react-native-maps"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major"]
    groups:
      app-minor-patch:
        update-types: [minor, patch]

  # Versions of the actions the CI workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Gaborone
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
